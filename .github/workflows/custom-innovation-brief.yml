name: innovation-brief

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date token to generate, for example 20260527. Leave empty to use the latest docs day."
        required: false
        default: ""
      mode:
        description: "Recommend mode, for example standard or skims."
        required: false
        default: "standard"
      no_llm:
        description: "Use fallback generation without LLM. true/false."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: innovation-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLT_API_KEY: ${{ secrets.BLT_API_KEY || secrets.SUMMARY_API_KEY }}
      BLT_SUMMARY_MODEL: ${{ secrets.BLT_SUMMARY_MODEL || secrets.SUMMARY_MODEL }}
      LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL || secrets.SUMMARY_BASE_URL }}
      BLT_PRIMARY_BASE_URL: ${{ secrets.BLT_PRIMARY_BASE_URL || secrets.SUMMARY_BASE_URL }}
      BLT_API_BASE: ${{ secrets.BLT_API_BASE || secrets.SUMMARY_BASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests

      - name: Generate innovation brief
        run: |
          set -euo pipefail

          DATE_INPUT="${{ github.event.inputs.date }}"
          MODE_INPUT="${{ github.event.inputs.mode }}"
          NO_LLM_INPUT="${{ github.event.inputs.no_llm }}"

          if [ -z "${DATE_INPUT}" ]; then
            DATE_INPUT="latest"
          fi
          if [ -z "${MODE_INPUT}" ]; then
            MODE_INPUT="standard"
          fi

          ARGS=(--date "${DATE_INPUT}" --mode "${MODE_INPUT}")
          if [ "${NO_LLM_INPUT}" = "true" ]; then
            ARGS+=(--no-llm)
          fi

          python src/7.generate_innovation_brief.py "${ARGS[@]}"

      - name: Commit innovation brief
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs
          if git diff --cached --quiet; then
            echo "No innovation brief changes to commit."
            exit 0
          fi

          git commit -m "[chore] generate innovation brief"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
